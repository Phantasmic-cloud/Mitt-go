name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: core/go.sum

      - name: Install SDK and NDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-37.0" "build-tools;35.0.0" "ndk;27.2.12479018"
          # AGP 8.7 resolves platforms/android-37, while the SDK channel now ships
          # API 37 as android-37.0. Copy it under the expected name and fix the
          # package id so the SDK loader accepts it.
          PLATFORMS="$ANDROID_HOME/platforms"
          if [ ! -d "$PLATFORMS/android-37" ]; then
            cp -a "$PLATFORMS/android-37.0" "$PLATFORMS/android-37"
            sed -i 's/platforms;android-37\.0/platforms;android-37/g' \
              "$PLATFORMS/android-37/package.xml" "$PLATFORMS/android-37/source.properties" 2>/dev/null || true
          fi
          ls -l "$PLATFORMS"

      - name: Build Go core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          sh scripts/build-go-ndk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.MITT_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MITT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MITT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MITT_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "no release keystore configured, falling back to the debug key"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mittgo-release.jks"
          {
            echo "MITT_KEYSTORE=$RUNNER_TEMP/mittgo-release.jks"
            echo "MITT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MITT_KEY_ALIAS=$KEY_ALIAS"
            echo "MITT_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease -x :app:checkReleaseAarMetadata

      - name: Package APK
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/Mitt-go-arm64-v8a-release-$VERSION.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mitt-go-release-apk
          path: dist/Mitt-go-arm64-v8a-release-*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Mitt-go-arm64-v8a-release-*.apk
