name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: core/go.sum

      - name: Install SDK and NDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-37.0" "build-tools;35.0.0" "ndk;27.2.12479018"
          PLATFORMS="$ANDROID_HOME/platforms"
          # AGP 8.7 looks for platforms/android-37 while the current SDK channel ships
          # the platform as android-37.0, so expose it under the expected name.
          [ -d "$PLATFORMS/android-37" ] || ln -s "$PLATFORMS/android-37.0" "$PLATFORMS/android-37"
          ls -l "$PLATFORMS"

      - name: Build Go core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          sh scripts/build-go-ndk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 未配置 release keystore 时用 AGP 生成的 debug key 签名。
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Package APK
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/Mitt-go-arm64-v8a-release-$VERSION.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mitt-go-release-apk
          path: dist/Mitt-go-arm64-v8a-release-*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Mitt-go-arm64-v8a-release-*.apk
