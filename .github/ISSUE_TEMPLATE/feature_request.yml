name: Feature request
description: 想要的功能或改进
labels: [ enhancement ]
body:
  - type: textarea
    id: what
    attributes:
      label: 想要什么
      description: 一句话说清功能，再补使用场景
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么需要
      description: 现在卡在哪、替代方案是什么
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        注意：Mitt-go 只做 Android 上的本机抓包，不考虑需要 root 才能实现的功能（KernelSU 证书安装除外），也不会内置任何未授权流量的转发服务。